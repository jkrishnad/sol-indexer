services:
  postgres:
    image: postgres:17
    container_name: sol_indexer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: solana_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: indexer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solana_user -d indexer_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    container_name: sol_indexer_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
